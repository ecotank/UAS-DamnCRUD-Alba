name: DamnCRUD CI/CD Pipeline

on:
  push:
    branches: [ main, master, uas2026 ]
  pull_request:
    branches: [ main, master, uas2026 ]

jobs:
  functional-tests:
    name: Parallel Functional Testing (Pytest + Selenium)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: badcrud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mysqli

      - name: Initialize & Import Database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot123 -e "DROP DATABASE IF EXISTS badcrud; CREATE DATABASE badcrud; DROP DATABASE IF EXISTS damncrud; CREATE DATABASE damncrud;"
          mysql -h 127.0.0.1 -P 3306 -u root -proot123 damncrud < db/damncrud.sql
          sed 's/`damncrud`/`badcrud`/g' db/damncrud.sql | mysql -h 127.0.0.1 -P 3306 -u root -proot123 badcrud

      - name: Start PHP Built-in Server
        run: |
          php -S 127.0.0.1:8000 &
          sleep 3

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist selenium webdriver-manager

      - name: Run Pytest Parallel Functional Tests
        env:
          BASE_URL: http://127.0.0.1:8000
        run: |
          pytest tests/test_damncrud.py -v -n auto
